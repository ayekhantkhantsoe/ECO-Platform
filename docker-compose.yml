# Local development database only. Staging/production use Supabase Postgres.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: eco
      POSTGRES_DB: eco
    ports:
      - '5432:5432'
    volumes:
      - eco-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eco -d eco']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eco-db:
