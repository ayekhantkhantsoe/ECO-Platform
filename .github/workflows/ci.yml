name: CI

on:
  pull_request:
  push:
    branches: [main, danger-zone]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so config validation and Prisma can load; no real database is needed.
      DATABASE_URL: postgresql://eco:eco@localhost:5432/eco
      DIRECT_URL: postgresql://eco:eco@localhost:5432/eco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
